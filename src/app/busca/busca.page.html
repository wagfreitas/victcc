<ion-content [fullscreen]="true">

  <div class="verde">
    <button class="botao-seta"
      (click)="voltar()">
      <img class="seta" src="../../assets/images/seta.png" />
    </button>
    <div class="titulo">Busca por <br/> profissional</div>
    <ion-searchbar color="light" placeholder="Buscar" [debounce]="50" (ionInput)="handleInput($event)"></ion-searchbar>
  </div>


  <ion-card>
    <ion-card-content>
      <ion-list>
        <ion-item *ngFor="let result of results">
          <ion-thumbnail slot="start">
            <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/thumbnail.svg" />
          </ion-thumbnail>
          <ion-label>Nome</ion-label>
          <ion-label>{{ result }}</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>


</ion-content>
