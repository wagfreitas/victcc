<ion-content [fullscreen]="true">

  <div class="verde">
    <button class="botao-seta"
      (click)="voltar()">
      <img class="seta" src="../../assets/images/setaB.png" />
    </button>
    <div class="titulo">Busca por <br/> profissional</div>
    <ion-searchbar class="barra" color="light" placeholder="Buscar" [debounce]="0" (ionInput)="handleInput($event)"></ion-searchbar>
  </div>

  <ion-card style="position: relative; top: 30%;">
    <ion-card-content style="padding: 15px 20px 15px 5px;">
      <ion-list>
        <ion-item *ngFor="let result of results" class="lista">
          <ion-thumbnail slot="start">
            <img style="border-radius: 30px;" alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/thumbnail.svg" />
          </ion-thumbnail>
          <ion-label>NOME <BR/> {{ result }}</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>


</ion-content>
