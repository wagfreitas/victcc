<ion-content [fullscreen]="true" style="--background: #3D8FEF;">
  <button class="botao-seta" (click)="voltar()">
    <img class="seta" src="../../assets/images/seta.png" />
  </button>


  <ion-input class="titulo" ionFocus="openModal()" placeholder="NOVO PROJETO" [(ngModel)]="nomeProjeto" type="string"
    disabled></ion-input>


  <ion-accordion-group class="caixa" expand="inset">
    <ion-accordion *ngFor="let sistema of sistemas">
      <!-- Header da etapa -->
      <ion-item slot="header" color="light" class="caixa1">
        <ion-label>{{sistema.descricaoSistema}} </ion-label>
      </ion-item>

      <!-- Conteúdo da etapa -->
      <div slot="content" class="caixa2">
        <ion-list *ngFor="let etapa of sistema.etapas">
          <ion-item (click)="toggleProcess(etapa)">
            <ion-icon [name]="etapa.expanded ? 'remove-circle' : 'add-circle'" slot="start"></ion-icon>
            <ion-label>{{ etapa.descricaoEtapa }}</ion-label>
          </ion-item>
          <div *ngIf="etapa.expanded">
            <div *ngFor="let medida of etapa.medidas">
              <ion-item class="medida-container">
                <ion-label>{{ medida.descricaoMedida }}: </ion-label>
                <ion-input type="text" [(ngModel)]="medida.valor"></ion-input>
              </ion-item>
            </div>
          </div>


        </ion-list>
      </div>
    </ion-accordion>
  </ion-accordion-group>


  <ion-footer>
    <ion-button expand="full" class="botao-finalizar" (click)="confirmar()">Confirmar</ion-button>
  </ion-footer>
</ion-content>
