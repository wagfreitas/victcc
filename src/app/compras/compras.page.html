<ion-content [fullscreen]="true">

  <button class="botao-seta" (click)="voltar()">
    <img class="seta" src="../../assets/images/seta.png" />
  </button>
  <img class="logo" src="../../assets/images/Logo.png" />
  <p class="titulo">{{nomeProjeto}}</p>

  <p class="titulo2">Compras e contratações</p>

  <ion-content class="cinza">
    <ion-segment [(ngModel)]="segment">
      <ion-segment-button style="font-size: 20px; height: 40px;" value="faltante">
        <ion-label>Faltante</ion-label>
      </ion-segment-button>
      <ion-segment-button style="font-size: 20px; height: 40px;" value="comprado">
        <ion-label>Comprado</ion-label>
      </ion-segment-button>
    </ion-segment>

    <ng-container *ngIf="segment === 'faltante'">
      <ion-card *ngFor="let sistema of sistemas">
        <ion-card-header>
          <label class="etapa">{{sistema.descricaoSistema}}</label>
        </ion-card-header>

        <ion-card-content>

          <div *ngFor="let etapa of sistema.etapas" class="processo">
            <div class="processo">
              <strong>{{ etapa.descricaoEtapa }}</strong>
            </div>
            <ng-container *ngIf="etapa.materiais && etapa.materiais.length > 0 ">
              <div class="atividade">

                <div class="material-list">
                  <div *ngFor="let material of etapa.materiais">
                    <div *ngIf="!material.comprado" class="material-item">
                      <ion-item lines="none">
                        <ion-checkbox slot="start" (ionChange)="onCheckMaterial(etapa, material)">
                        </ion-checkbox>
                        <ion-label>{{ material.descricaoMaterial }}</ion-label>
                      </ion-item>
                    </div>
                  </div>
                </div>
              </div>
            </ng-container>
          </div>
        </ion-card-content>
      </ion-card>
    </ng-container>

    <ng-container *ngIf="segment === 'comprado'">
      <ion-card *ngFor="let sistema of sistemas">
        <ion-card-header>
          <label class="etapa">{{sistema.descricaoSistema}}</label>
        </ion-card-header>

        <ion-card-content>

          <div *ngFor="let etapa of sistema.etapas" class="processo">
            <div class="processo">
              <strong>{{ etapa.descricaoEtapa }}</strong>
            </div>
            <ng-container *ngIf="etapa.materiais && etapa.materiais.length > 0 ">
              <div class="atividade">

                <div class="material-list">
                  <div *ngFor="let material of etapa.materiais">
                    <div *ngIf="material.comprado" class="material-item">
                      <ion-item lines="none">
                        <ion-label>{{ material.descricaoMaterial }}</ion-label>
                      </ion-item>
                    </div>
                  </div>
                </div>
              </div>
            </ng-container>
          </div>
        </ion-card-content>
      </ion-card>

    </ng-container>

  </ion-content>

</ion-content>
